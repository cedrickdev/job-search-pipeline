# Alembic, configured for one database and one migration directory.
#
# Everything about the V2 schema comes from `backend/migrations/versions`. A fresh
# PostgreSQL instance must be constructible from `alembic upgrade head` alone —
# including `CREATE EXTENSION postgis` (rev 0001) — which is what makes the schema
# reproducible instead of being whatever `create_all` last produced. The V1
# pattern of `ALTER TABLE` wrapped in a bare `except Exception: pass` is exactly
# what this replaces (docs/PERSISTENCE.md §Migrations).

[alembic]
# `%(here)s` is this file's directory, so the location does not depend on the
# working directory Alembic is invoked from.
script_location = %(here)s/backend/migrations

# The repository root, so `env.py` can import `backend.app...` even when the
# project is not installed in the interpreter running Alembic.
prepend_sys_path = %(here)s

# Explicit rather than relying on the legacy fallback, which splits on spaces and
# commas and would break on a path containing either.
path_separator = os

# A leading `rev_` keeps every revision file a valid Python identifier: revision
# ids are sequential (`--rev-id 0002`), and a module that starts with a digit
# cannot be imported by name, which puts it out of reach of mypy and of any test
# that wants to inspect a migration.
file_template = rev_%%(rev)s_%%(slug)s

# `sqlalchemy.url` is deliberately absent. The URL comes from
# `DatabaseSettings.from_env()` inside env.py, so Alembic, the async
# repositories, the tests and docker-compose all resolve the database the same
# way — and no credential is ever written in this file (ENGINEERING_STANDARDS
# §Security). Set `DATABASE_URL` in the environment instead.

# No `post_write_hooks`: a hook that runs Ruff would make `alembic revision`
# depend on a dev-only tool being installed in whatever environment generates it.
# Generated revisions are reviewed and edited by hand anyway — `ruff check .`
# covers them like any other file.

# --------------------------------------------------------------------------
# Logging. `alembic` at INFO is what prints "Running upgrade 0001 -> 0002", the
# only progress a migration gives; SQLAlchemy stays at WARNING so a migration
# does not dump every statement, with parameter values, into a CI log.
# --------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
