[project]
name = "jobsearch-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # A runtime dependency, not a test one: server/chat.py imports httpx at module
    # scope for the OpenAI-compatible copilot backends, and server/routes/prep.py
    # imports that module — so create_app() cannot build without it. It sat in
    # `[dev]` only, which no environment noticed until Phase 3 ran the API from a
    # runtime-only install (docker-compose.yml `api`), where it failed at import.
    # Still available to the tests, which use it for starlette's TestClient: an
    # extra installs the base dependencies too.
    "httpx>=0.27",
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Declared in its own right from Phase 1 on: the V2 domain is built out of
    # pydantic v2 models and must not depend on FastAPI dragging pydantic in.
    # v2 specifically — `ConfigDict`, `model_validator` and `Annotated`
    # constraints are what the typed contracts are made of.
    "pydantic>=2.7",
    # --- Phase 2: V2 persistence -------------------------------------------
    # `[asyncio]` pulls greenlet, which `create_async_engine` needs. The V2
    # repositories are async because the API and the workers that will call them
    # are (docs/ARCHITECTURE.md §1, §6); Alembic runs the same URL synchronously.
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    # psycopg 3, not asyncpg: one driver serves both the async engine
    # (`postgresql+psycopg`) and Alembic's sync engine, so there is a single URL
    # and a single wire implementation to reason about. `[binary]` ships libpq in
    # the wheel, so no system PostgreSQL client is required to run the tests.
    "psycopg[binary]>=3.2",
    # --- Phase 4: authentication -------------------------------------------
    # Argon2id, the password hash the OWASP storage cheat sheet recommends first
    # and the only memory-hard algorithm available without a compiled extension
    # of our own. bcrypt truncates at 72 bytes and PBKDF2 is cheap on a GPU;
    # neither is worth choosing for a new table. `PasswordHasher` also carries
    # `check_needs_rehash`, which is what lets the cost parameters be raised later
    # without invalidating anybody's password (docs/AUTHENTICATION.md).
    "argon2-cffi>=23.1",
    # Pydantic's `EmailStr` raises at import time without it, and an email address
    # is the login identifier — so this is a runtime dependency of the API, not a
    # convenience for the tests.
    "email-validator>=2.1",
]

[project.optional-dependencies]
# Quality tools are pinned exactly, not ranged: a lint/type baseline is only
# reproducible (Phase 0 acceptance) if CI and the dev machine run the same
# analyzer build. Bump them deliberately, in their own change.
dev = [
    "pytest>=8.0",
    # Phase 2's repository tests are coroutines. Strict mode below keeps every
    # V1 test running exactly as before: only functions marked `asyncio` change.
    "pytest-asyncio>=1.2",
    "ruff==0.14.6",
    "mypy==1.19.0",
    "types-PyYAML==6.0.12.20250915",  # yaml is read by 7 pipeline modules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit rather than defaulted: `strict` means an async test without the
# `asyncio` marker is an error instead of a silently skipped coroutine, and
# pinning the fixture loop scope keeps a pytest-asyncio default change from
# quietly altering how the database fixtures are torn down.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `backend*` joins the V1 packages rather than replacing them: V1 keeps shipping
# exactly as it did (docs/IMPLEMENTATION_PLAN.md Phase 1 preserves V1), and the
# V2 packages are listed explicitly because this project does not use automatic
# discovery — an unlisted package would import fine from a source checkout and
# then be missing from an installed wheel.
packages = ["pipeline", "pipeline.sources", "pipeline.apply", "dashboard", "server", "server.routes",
            "backend", "backend.app", "backend.app.domain", "backend.app.compat",
            "backend.app.core", "backend.app.infrastructure",
            "backend.app.infrastructure.database", "backend.app.repositories",
            "backend.app.cli", "backend.app.services", "backend.app.api",
            "backend.app.api.routes", "backend.app.discovery",
            "backend.app.discovery.adapters",
            "country_packs", "country_packs.ch"]

# A Country Pack is five YAML files and a six-line loader (Phase 5): without this
# the wheel would ship the loader and none of its content, and `load_pack()`
# would raise COUNTRY_PACK_FILE_MISSING from an installed environment while
# working perfectly from a source checkout.
[tool.setuptools.package-data]
"country_packs.ch" = ["*.yaml"]

# --------------------------------------------------------------------------
# Ruff (Phase 0). The full rule set below applies to EVERY Python file. V1
# directories predate the linter, so their existing violations are listed
# per-directory in [tool.ruff.lint.per-file-ignores] with counts recorded in
# docs/V1_BASELINE.md. That keeps `ruff check` green today while holding new V2
# code (backend/app, country_packs) to the undiluted set: a legacy directory can
# only regress in ways it already regresses, and nothing new can.
# The formatter is deliberately NOT enabled yet — running it would rewrite the
# whole V1 tree, which Phase 0 forbids.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100          # the width V1 was already written to
target-version = "py312"   # matches requires-python, not the local interpreter
extend-exclude = ["data", "out", "cv/output"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade (keeps 3.12+ syntax)
    "B",        # bugbear
    "C4",       # comprehensions
    "ASYNC",    # async correctness (this codebase streams subprocesses + httpx)
    "RUF100",   # no stale noqa
    # Security subset kept narrow on purpose: hardcoded credentials and SQL
    # built by string concatenation are the two ENGINEERING_STANDARDS rules a
    # linter can actually enforce. The rest of flake8-bandit is noise here.
    "S105", "S106", "S107", "S608",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are calls in default arguments by design; B008
# would fire on every route signature.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# V1 baseline — see docs/V1_BASELINE.md §Lint baseline for per-rule counts.
"pipeline/**" = [
    "E501", "E702",              # long lines / semicolons
    "I001", "F401", "F841",      # import order, unused imports and locals
    "UP017", "UP024", "UP037",   # datetime.UTC, OSError aliases, quoted annotations
    "B904", "B905",              # raise-from, zip(strict=)
    "C420", "RUF100",
    "ASYNC109",                  # own `timeout=` params instead of asyncio.timeout
    "S105", "S608",              # reviewed: an env-var NAME, and whitelisted column lists
]
"server/**" = [
    "E501",
    "I001", "F401",
    "UP017", "UP035", "UP041", "UP045",
    "B904",
    "ASYNC109",
    "S608",                      # reviewed: column names from fixed whitelists
]
"scripts/**" = ["E501", "I001", "F401", "F541", "F841", "B905"]
"tests/**" = [
    "E501", "I001", "F401", "F841",
    "B007", "B011", "B017",      # `assert False` / broad pytest.raises in tests
]

# --------------------------------------------------------------------------
# mypy (Phase 0). Two tiers, as the plan requires: V1 modules are checked
# leniently so no rewrite is forced, while V2 packages get the strict flag set
# spelled out (mypy's `strict` shorthand is global-only, so it cannot be applied
# through an override).
#
# `files` stays V1-only, deliberately, now that backend/ exists (Phase 1).
# .github/workflows/ci.yml runs two steps: a bare `mypy`, whose error count is
# compared against BASELINE=22, and a separate `mypy backend country_packs` that
# must be clean. Adding "backend" here would fold V2 errors into the V1 count and
# a future V2 regression would be reported as a V1 baseline drift. Run
# `mypy backend` (or the CI step) to check V2.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["pipeline", "server", "dashboard"]
ignore_missing_imports = true
# Off because a bare `mypy` run checks V1 only (see above) and would otherwise
# report the backend.*/country_packs.* override as an unused section on every run.
warn_unused_configs = false
# Left OFF globally on purpose: turning either on would flag most V1 functions
# and amount to demanding the rewrite Phase 0 forbids.
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["backend.*", "country_packs.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

# Phase 5. The V2 source adapters wrap V1's `pipeline/sources/*` modules rather
# than reimplementing them, so `mypy backend country_packs` now *follows* imports
# into V1 — where five of the 22 documented baseline errors live
# (docs/V1_BASELINE.md). Without this the strict step would fail on legacy debt it
# does not own, and the only ways to make it pass would be to rewrite V1 (Phase 0
# forbids it) or to relax a rule (this phase's order forbids it).
#
# This is a *reporting scope* setting, not a relaxed rule: `follow_imports` has no
# effect on modules named explicitly, and `files` above names `pipeline`. So the
# bare `mypy` run still checks every V1 module and still reports exactly the 22
# errors CI gates on — both tiers keep the strength they had.
[[tool.mypy.overrides]]
module = ["pipeline.*"]
follow_imports = "silent"
