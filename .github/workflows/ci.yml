# CI added in Phase 0. Three properties must stay true here:
#   1. no step contacts a live job board or a live LLM provider
#      (docs/ENGINEERING_STANDARDS.md) — every adapter test reads a fixture;
#   2. the V1 type baseline is measured and regression-gated, not enforced, so
#      legacy modules are never forced into a rewrite;
#   3. the whole suite runs from a clean checkout with nothing deselected and no
#      private data materialized. The CV library the tests need is the tracked
#      synthetic tests/fixtures/base_cv.yaml — see docs/V1_BASELINE.md §9.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here deploys or writes, so no ambient write credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # WeasyPrint renders the CV PDFs whose page count and fill ratio the tests
      # assert on; it loads the Pango stack at import time and needs a font.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 fonts-dejavu-core

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type-check V2 packages (strict)
        run: |
          targets=""
          for d in backend country_packs; do
            if [ -d "$d" ]; then targets="${targets} ${d}"; fi
          done
          if [ -z "${targets}" ]; then
            echo "No V2 package yet — Phase 1 creates backend/app. Nothing to check."
            exit 0
          fi
          mypy ${targets}

      # Measured, not enforced: the count is allowed to fall, never to rise.
      # That separates legacy debt from a new failure without demanding that V1
      # be re-annotated first (Phase 0 acceptance).
      - name: Type-check V1 modules (regression-gated baseline)
        env:
          BASELINE: "22"
        run: |
          mypy > mypy-v1.log 2>&1 || true
          cat mypy-v1.log
          count=$(grep -c ': error:' mypy-v1.log || true)
          echo "V1 mypy errors: ${count} (documented baseline: ${BASELINE})"
          if [ "${count}" -gt "${BASELINE}" ]; then
            echo "::error::V1 type errors rose above the baseline in docs/V1_BASELINE.md"
            exit 1
          fi

      # No CV profile is materialized: tests/conftest.py resolves the base CV
      # library to the tracked synthetic tests/fixtures/base_cv.yaml, so the
      # operator's gitignored cv/base_cv.yaml is neither needed nor consulted.
      - name: Tests (pytest)
        run: python -m pytest -q

  # Added in Phase 2. Additive on purpose: the `backend` job above still runs the
  # whole suite with no database, where the V2 persistence tests skip themselves
  # (tests/v2_database.py). This job is the one that has no excuse — it provides
  # PostGIS and then asserts nothing was skipped, so a database test that quietly
  # stops running is a red build rather than a silent gap.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same tag as docker-compose.yml, for the same reason: the PostGIS
        # version decides what `ST_AsEWKT` prints, and the geo tests compare
        # coordinates exactly.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: jobsearch
          # Ephemeral service container on a private network, reachable only by
          # this job's steps. Not a secret, and deliberately the same throwaway
          # value as the compose default.
          POSTGRES_PASSWORD: jobsearch_dev_only
          POSTGRES_DB: jobsearch_test
        ports:
          - 5432:5432
        # `services` has no `depends_on`, so the health check is what makes the
        # first step wait for a server that is actually accepting queries.
        options: >-
          --health-cmd "pg_isready -U jobsearch -d jobsearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Read only by DatabaseSettings.for_tests. The suite drops and recreates
      # this schema, and revision 0001 reinstalls PostGIS each time.
      JOBSEARCH_TEST_DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch_dev_only@localhost:5432/jobsearch_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # No WeasyPrint stack here: this job runs the nine V2 persistence modules
      # only, and none of them render a PDF.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Migrate an empty database from scratch
        env:
          JOBSEARCH_DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch_dev_only@localhost:5432/jobsearch_test
        run: alembic upgrade head

      - name: Tests (PostgreSQL + PostGIS)
        run: |
          # `bash -e` does not imply pipefail, and pytest's status is on the left
          # of the pipe: without this a failing test would be masked by `tee`.
          set -o pipefail
          python -m pytest -q -rs \
            tests/test_v2_persistence_settings.py \
            tests/test_v2_persistence_schema.py \
            tests/test_v2_persistence_mappers.py \
            tests/test_v2_persistence_migrations.py \
            tests/test_v2_persistence_constraints.py \
            tests/test_v2_persistence_repositories.py \
            tests/test_v2_persistence_geo.py \
            tests/test_v2_company_persistence.py \
            tests/test_v2_import_v1.py \
            | tee pytest-database.log
          if grep -qE '[0-9]+ skipped' pytest-database.log; then
            echo "::error::a database test skipped itself while PostGIS was available"
            exit 1
          fi

  # The frontend. Nuxt 4 is the only one: Phase 3 closure removed `webapp/` and the
  # React job that gated it, once the 111 Vitest specs and 14 Playwright flows below
  # had been shown to cover every V1 surface.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Reads frontend/.npmrc, whose `legacy-peer-deps=true` works around an npm
      # arborist crash on this dependency set; that file records the bug and the
      # peer-range audit showing it hides no real conflict. `postinstall` is
      # `nuxt prepare`, which the typecheck below needs.
      - run: npm ci

      # Covers the app AND tests/nuxt/**: .nuxt/tsconfig.app.json includes that
      # directory, which is exactly why the specs live under that name.
      - run: npm run typecheck

      # Vitest + Vue Test Utils, inside @nuxt/test-utils' Nuxt environment.
      - run: npm test

      # The production build.
      - run: npm run build

      # And the artifact the deployment actually uses. `ssr: false` means
      # production is V1's single-origin model — FastAPI serving a static bundle —
      # and `nuxt build` alone leaves a Nitro server, not files. `generate`
      # prerenders the four routes, and the assertion is the contract with
      # server/app.py::_mount_spa: an index.html to fall back to and an `assets`
      # directory to mount. Nothing else in the repo would notice if
      # `app.buildAssetsDir` drifted back to Nuxt's default `/_nuxt/`.
      - run: npm run generate
      - name: The generated bundle is the one FastAPI can serve
        run: |
          test -f .output/public/index.html
          test -d .output/public/assets
          grep -q '"/assets/' .output/public/index.html

  # A separate job from `frontend` so a browser failure is never confused with a
  # unit failure, and so the two run concurrently rather than one after the other.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chromium only, matching the single project in playwright.config.ts: these
      # tests assert application behaviour, and a parity migration has no
      # cross-browser claim to defend.
      - run: npx playwright install --with-deps chromium

      # No backend, no database, no network. Every /api/** request is fulfilled in
      # the browser by tests/e2e/support/api.ts, and each test asserts that nothing
      # went unstubbed — so a missed mock fails the run instead of reaching a live
      # job board or a live LLM (CLAUDE.md §Testing). playwright.config.ts starts
      # its own `nuxt dev` on port 3113 and refuses to reuse a foreign server.
      - run: npm run e2e

      # Traces (on first retry) and failure screenshots. Nothing is uploaded from a
      # green run, and nothing in these tests carries operator data.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The OpenAPI contract, checked rather than trusted. V1 generated its TypeScript
  # by pointing openapi-typescript at whichever server happened to be running, and
  # nothing ever detected drift. This job regenerates both links of the chain —
  # FastAPI -> openapi.json -> app/types/api.d.ts — on a clean runner and fails if
  # either committed file no longer matches, which is what makes the generated
  # client worth typing against instead of a hand-maintained duplicate.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # create_app imports every router, and one of them imports the CV renderer,
      # which links the Pango stack at import time.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 fonts-dejavu-core

      # Runtime dependencies only: the schema comes from the app itself, no test
      # tooling is involved.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install frontend toolchain
        working-directory: frontend
        run: npm ci

      # scripts/dump_openapi.py builds the app in-process against a throwaway
      # SQLite file in a temp directory, so no server is started and the
      # operator's data/tracker.db is never touched.
      - name: OpenAPI and generated types match FastAPI
        working-directory: frontend
        run: npm run check:api
