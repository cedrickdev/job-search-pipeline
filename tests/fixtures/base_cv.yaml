# Synthetic base CV library — TEST FIXTURE ONLY.
#
# Every value here is invented. There is no real person, employer, school,
# phone number or address in this file: `example.test` is an RFC 2606 reserved
# domain and the phone number is all zeros. Production loads the operator's own
# gitignored cv/base_cv.yaml instead (pipeline.paths.BASE_CV_PATH); the test
# suite redirects that constant here so a clean clone can run every test.
#
# It is deliberately DENSE: tests/test_cv_render.py asserts that the base
# library fills more than 92% of one A4 page in both languages, that trimming
# it to one bullet per job drops below that floor, and that 15 long priority-3
# filler bullets are dropped before any priority-1 bullet. Read
# docs/V1_BASELINE.md §9 before editing, then re-check with
# `python -m pipeline.cv_render`.
#
# Two properties keep the numbers identical on macOS (Helvetica) and on CI
# (DejaVu, the only font Ubuntu's fonts-dejavu-core provides):
#   1. cv/style.css sets a unitless `line-height: 1.45`, so every block's
#      height is a multiple of the font SIZE, never of its metrics;
#   2. therefore only a different line COUNT can move the fill, so no line of
#      text here may come close to filling its width. Keep bullets under ~70
#      characters in both languages.

