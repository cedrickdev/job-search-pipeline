# Development composition for the V2 platform.
#
# Long-running services — the database (Phase 2), Redis (Phase 16), the FastAPI API
# and the Nuxt frontend (Phase 3) — plus the Phase 16 background workers and the
# one-shot commands that must run in the same environment as the application
# (docs/ARCHITECTURE.md §13, docs/PRODUCTION_DEPLOYMENT.md).
#
#   docker compose up -d                              database + Redis + API + frontend
#   docker compose --profile workers up -d            add the general and browser workers
#   docker compose up -d postgres                     the database alone
#   docker compose run --rm migrate                   alembic upgrade head
#   docker compose run --rm import-v1 --help          V1 SQLite import
#   docker compose run --rm backup                    write a PostgreSQL dump (§45)
#   docker compose run --rm restore-check             restore-drill the newest dump (§46)
#
# Two profiles keep `docker compose up` lean: `workers` holds the two task-queue
# workers (so the base stack is db + Redis + API + frontend), and `tools` holds the
# one-shot jobs, so starting the stack never runs a migration, a backup or an import
# as a side effect.
#
# No service reads `.env`. Compose interpolates it into the values below, which is
# how a developer overrides a port or the password, but nothing here mounts it or
# passes it through: `.env` holds V1's real API credentials and none of them belong
# in these containers, and no image layer ever carries a secret (§55). The same rule
# is why no container sees `data/` or `cv/` — see the `api` service below. A real
# deployment supplies secrets through its orchestrator's secret store, never this file
# (docs/PRODUCTION_DEPLOYMENT.md).

name: jobsearch

services:
  postgres:
    # PostGIS on top of PostgreSQL 17. Pinned to a minor line rather than
    # `latest`: the extension version decides what `ST_AsEWKT` prints, and
    # round-tripping coordinates exactly is something the tests assert.
    #
    # `imresamu/postgis` rather than `postgis/postgis`: the official repository
    # publishes amd64 only, so on an arm64 machine it fails with "no matching
    # manifest" (or runs under emulation). This is the multi-arch build of the
    # same `postgis/docker-postgis` sources by the same maintainer — same
    # entrypoint, same `POSTGRES_*` variables, same `docker-entrypoint-initdb.d`
    # contract. One tag for developers and for CI keeps the two identical.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsearch_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch_dev}
      # Created by the init script below so the test suite has a database of its
      # own and can never drop the one holding imported V1 data.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-jobsearch_test}
    ports:
      # Bound to the loopback interface and to a non-default port: the database is
      # reachable from this machine only, and a developer's own PostgreSQL on 5432
      # is left completely alone — including by the tests, which default to 55432.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, when the data directory is first initialized.
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      # `pg_isready` against the real database, not just the port: the image
      # restarts PostgreSQL part-way through first-time initialization, so a TCP
      # check reports ready while the server is still about to go down again.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    # Redis, added in Phase 16. One deployment, one Redis, shared by the rate limiter
    # (§49) and the task subsystem (§34) — the same instance the workers point at. Pinned
    # to a minor line for the reason postgres is: an operator's stack and CI run the
    # identical server. `--save "" --appendonly no` turns persistence off: the queue's
    # truth is the PostgreSQL table (§34, DB-as-truth) and the rate-limit windows are
    # ephemeral and fail open (§50), so nothing here needs to survive a restart.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only, on the non-default port the dev Redis URL uses (LOCAL_DEV_REDIS_URL
      # is redis://127.0.0.1:56379/0), so a developer's own Redis on 6379 is left alone.
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Added in Phase 3, because a migrated frontend needs an API to talk to inside
  # the composition (completion criterion 8). One FastAPI application serves both
  # surfaces: V1's 29 SQLite-backed operations and, since Phase 4, `/api/v2`
  # against PostgreSQL (server/app.py mounts `create_v2_router()`), which is the
  # image `migrate` and `import-v1` also build.
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # server/app.py reads this before paths.DB_PATH. Explicit, so the tracker is
      # unambiguously the mounted volume below and not a file baked into a layer.
      JOBSEARCH_DB_PATH: /app/data/tracker.db
      # V2's database, the same URL `migrate` upgrades. Without it the V2 settings
      # would fall back to LOCAL_DEV_DATABASE_URL on 127.0.0.1:55432 — the port
      # published to the *host* — and every `/api/v2` request would answer 503 from
      # inside the container, where that address is the container itself.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
      # The one supported way to run without `Secure` cookies, declared rather than
      # inferred (docs/AUTHENTICATION.md §`Secure` is a deployment setting, never an
      # inference). This composition is reached over `http://localhost`, and a jar
      # that has accepted a `Secure` cookie will not send it back over HTTP: with the
      # default policy a developer would get a login that appears to succeed and then
      # does not. It also drops the `__Host-` prefix, which a non-`Secure` cookie
      # cannot carry. Never set this in a deployment a browser reaches over HTTPS.
      JOBSEARCH_AUTH_COOKIE_SECURE: "false"
      # The composition's one Redis, reached by service name. Without it the rate
      # limiter (on by default) would resolve LOCAL_DEV_REDIS_URL — 127.0.0.1:56379,
      # which inside this container is the container itself — and fail open on every
      # guarded request. Pointing it at the `redis` service makes the limit real in the
      # composition and matches how a deployment wires it (docs/PRODUCTION_DEPLOYMENT.md).
      JOBSEARCH_REDIS_URL: redis://redis:6379/0
    volumes:
      # A named volume, NOT a bind mount of ./data. That directory holds the
      # operator's real tracker, job-board logins and answers.yaml; a container
      # able to write to it is one bug away from corrupting the only copy, and two
      # processes on one SQLite file invite `database is locked`. So this container
      # starts with an EMPTY tracker, which create_app bootstraps via init_db —
      # every route the frontend calls answers, with no personal data anywhere in
      # the composition (docs/ENGINEERING_STANDARDS.md §Security). To work against
      # real data instead, replace this line with `- ./data:/app/data`, knowingly.
      - api_data:/app/data
      # Generated artifacts (account exports, document renders) live under /app/var. A
      # named volume shared with the `worker`, `backup` and `restore-check` services so an
      # export the general worker writes is the one the API streams back, and dumps persist.
      - app_var:/app/var
    ports:
      # Loopback only, on the port start.sh already uses, so the browser cannot
      # tell a containerized API from a host one.
      - "127.0.0.1:${API_PORT:-8765}:8765"
    # `--lifespan off` is load-bearing rather than tuning. create_app's lifespan
    # starts server/scheduler.py, whose is_due() defaults `schedule_enabled` to
    # True: a container left up past 08:00 local time would launch the agentic full
    # run by itself — live job boards, live LLM calls — out of a development
    # composition nobody was watching. Turning the lifespan off removes that
    # entirely; run_manager and apply_dispatcher are built in the factory body, so
    # an explicit POST /api/runs/... still works exactly as on the host.
    command:
      - uvicorn
      - --factory
      - server.app:create_app
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --lifespan
      - "off"
    healthcheck:
      # FastAPI's own schema document: it proves the app booted and its routers
      # imported, and it touches neither the database nor any operator file. The
      # image has no curl, so this is Python's stdlib.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/openapi.json').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      # `service_healthy` since Phase 4: `/api/v2` needs the database, and the engine
      # is created lazily by the first request that touches it, so an API started
      # ahead of PostgreSQL would answer 503 to the sign-in the frontend does on load.
      # V1's routes do not care — they are SQLite — which is why this was decoration
      # before and is not now.
      postgres:
        condition: service_healthy
      redis:
        # `service_started`, not `service_healthy`: the limiter fails open on a Redis
        # fault (§50), so the API is useful before Redis answers and must not be held
        # back by it — but declaring the edge still starts Redis first and orders shutdown.
        condition: service_started
    # The schema is still `docker compose run --rm migrate`'s job, not a startup
    # step: a service that migrates on boot migrates on every scale-up and every
    # restart loop. `/api/v2` answers 503 until it has been run once.
    #
    # This container answers /api only. `paths.FRONTEND_DIST` — frontend/.output/public
    # since Phase 3 closure — is excluded from the build context by .dockerignore, so
    # `_mount_spa` finds no bundle and skips itself, which is what the guards in it
    # are for. The `frontend` service below serves the UI in this composition; a
    # single-origin deployment builds the bundle on the host and lets FastAPI serve
    # it, as start.sh does.

  # The Nuxt dev server (docker/frontend.Dockerfile). Development convenience, not
  # a production artifact: with `ssr: false` production is a static bundle served
  # by the FastAPI process, so there is nothing else for a Node container to do.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # Read by nuxt.config.ts for the Nitro dev proxy. On a developer's machine
      # the default target is 127.0.0.1:8765; here the API is a service name.
      NUXT_API_PROXY_TARGET: http://api:8765/api
      # Vite's watcher never receives inotify events through a bind mount on macOS
      # or Windows, so without polling an edit on the host never reaches HMR.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Sources bind-mounted so an edit on the host reloads in the container.
      # node_modules and .nuxt stay container-side and must not be shadowed by the
      # host tree, which holds macOS binaries. The trade-off of the named volumes
      # is that they are seeded once from the image: after a dependency change,
      # rebuild and `docker compose down -v` (or `docker volume rm
      # jobsearch_frontend_node_modules`) or the container keeps the old install.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    ports:
      # 3000 is the app's own default and everybody else's; ${FRONTEND_PORT} is
      # there because an unrelated dev server on 3000 is a real and frequent event.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      # `service_started`, not `service_healthy`: the proxy resolves per request,
      # so the frontend is useful before the API answers and must not be held back
      # by it. Wanting the whole stack ready is what `up --wait` is for.
      api:
        condition: service_started
    restart: unless-stopped

  # The general-lane task worker (Phase 16 §34-35): discovery, export and retention
  # work, never a browser submission. Behind the `workers` profile so the base `up`
  # stays db + Redis + API + frontend; add it with `docker compose --profile workers up`.
  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "backend.app.cli.run_worker", "--lane", "general"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
      JOBSEARCH_REDIS_URL: redis://redis:6379/0
    volumes:
      # Shares the API's artifact volume so an export it writes is the file the API
      # streams back (see the `api` service). No `data/` — the worker touches no SQLite.
      - app_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # The schema is `docker compose run --rm migrate`'s job, never a worker startup step
    # (§58): a worker that migrates on boot migrates on every scale-up and restart loop.
    restart: unless-stopped

  # The browser-lane worker (Phase 16 §35): Playwright application submissions, on its
  # own Playwright-capable image so browsers never bloat the API/general-worker image.
  # `browser_concurrency` defaults to 1, so a wedged submission cannot starve the lane.
  # Also `workers`-profiled — a dev machine rarely needs a real browser submission.
  browser-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/browser-worker.Dockerfile
    command: ["python", "-m", "backend.app.cli.run_worker", "--lane", "browser"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
      JOBSEARCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    command: ["alembic", "upgrade", "head"]

  import-v1:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    volumes:
      # Read-only, and the importer opens the file read-only as well. The V1
      # tracker is the source of truth until V2 replaces it, and a migration tool
      # that can write to its own input is one bug away from destroying it.
      - ./data:/data:ro
    entrypoint: ["python", "-m", "backend.app.cli.import_v1"]
    command: ["--sqlite", "/data/tracker.db", "--on-error", "skip"]

  # A PostgreSQL dump under /app/var/backups on the shared artifact volume (§45). Built
  # from the `tools` image stage — the only one carrying pg_dump/pg_restore/psql (the
  # PostgreSQL 17 client, matching the server). The password reaches pg_dump through its
  # environment, never a command line or any output (backend/app/backup/tools.py).
  backup:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    volumes:
      - app_var:/app/var
    command: ["python", "-m", "backend.app.cli.run_backup", "create"]

  # The §46 recovery drill: restore the newest dump into an isolated scratch database,
  # check its migration revision and representative record counts, then drop the scratch
  # database. Exit 3 (NOT VERIFIED) is the signal a monitored drill watches for. Same
  # `tools` image, same shared volume so it reads the dump `backup` wrote.
  restore-check:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    volumes:
      - app_var:/app/var
    command: ["python", "-m", "backend.app.cli.run_backup", "verify"]

volumes:
  postgres_data:
    # Named, so `docker compose down` keeps the data and only
    # `docker compose down -v` throws it away.
    name: jobsearch_postgres_data

  api_data:
    # V1's SQLite tracker and settings.json for the containerized API, kept apart
    # from the host `data/` on purpose (see the `api` service). Nothing in it is
    # precious — `down -v` and it is bootstrapped empty again on the next start.
    name: jobsearch_api_data

  # Generated artifacts under /app/var: account exports, document renders and PostgreSQL
  # dumps. Shared by `api`, `worker`, `backup` and `restore-check` so a file one writes is
  # the file another reads. `down` keeps it; only `down -v` throws the dumps away.
  app_var:
    name: jobsearch_app_var

  # Container-side node_modules and .nuxt, so the bind-mounted sources do not
  # shadow the Linux install with the host's macOS one.
  frontend_node_modules:
    name: jobsearch_frontend_node_modules
  frontend_nuxt:
    name: jobsearch_frontend_nuxt
