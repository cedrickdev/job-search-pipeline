# Development composition for the V2 foundation.
#
# Three long-running services — the database (Phase 2), the FastAPI API and the
# Nuxt frontend (Phase 3) — plus two one-shot commands that must run in the same
# environment as the application (docs/IMPLEMENTATION_PLAN.md Phases 2 and 3).
# Redis, the background worker and the Playwright browser worker join no earlier
# than Phase 12; they are deliberately absent rather than declared and disabled,
# because an inert service still has to be maintained and docs/ARCHITECTURE.md §13
# already records the target composition.
#
#   docker compose up -d                              database + API + frontend
#   docker compose up -d postgres                     the database alone
#   docker compose run --rm migrate                   alembic upgrade head
#   docker compose run --rm import-v1 --help          V1 SQLite import
#
# The `tools` profile keeps the two one-shot services out of `docker compose up`,
# so starting the stack never runs a migration as a side effect.
#
# No service reads `.env`. Compose interpolates it into the values below, which is
# how a developer overrides a port or the password, but nothing here mounts it or
# passes it through: `.env` holds V1's real API credentials and none of them belong
# in these containers (docs/ENGINEERING_STANDARDS.md §Security). The same rule is
# why no container sees `data/` or `cv/` — see the `api` service below.

name: jobsearch

services:
  postgres:
    # PostGIS on top of PostgreSQL 17. Pinned to a minor line rather than
    # `latest`: the extension version decides what `ST_AsEWKT` prints, and
    # round-tripping coordinates exactly is something the tests assert.
    #
    # `imresamu/postgis` rather than `postgis/postgis`: the official repository
    # publishes amd64 only, so on an arm64 machine it fails with "no matching
    # manifest" (or runs under emulation). This is the multi-arch build of the
    # same `postgis/docker-postgis` sources by the same maintainer — same
    # entrypoint, same `POSTGRES_*` variables, same `docker-entrypoint-initdb.d`
    # contract. One tag for developers and for CI keeps the two identical.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsearch_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch_dev}
      # Created by the init script below so the test suite has a database of its
      # own and can never drop the one holding imported V1 data.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-jobsearch_test}
    ports:
      # Bound to the loopback interface and to a non-default port: the database is
      # reachable from this machine only, and a developer's own PostgreSQL on 5432
      # is left completely alone — including by the tests, which default to 55432.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, when the data directory is first initialized.
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      # `pg_isready` against the real database, not just the port: the image
      # restarts PostgreSQL part-way through first-time initialization, so a TCP
      # check reports ready while the server is still about to go down again.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Added in Phase 3, because a migrated frontend needs an API to talk to inside
  # the composition (completion criterion 8). This is still V1's FastAPI
  # application: Phase 3 migrates the frontend and nothing else, so the image is
  # the same one `migrate` and `import-v1` build.
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # server/app.py reads this before paths.DB_PATH. Explicit, so the tracker is
      # unambiguously the mounted volume below and not a file baked into a layer.
      JOBSEARCH_DB_PATH: /app/data/tracker.db
    volumes:
      # A named volume, NOT a bind mount of ./data. That directory holds the
      # operator's real tracker, job-board logins and answers.yaml; a container
      # able to write to it is one bug away from corrupting the only copy, and two
      # processes on one SQLite file invite `database is locked`. So this container
      # starts with an EMPTY tracker, which create_app bootstraps via init_db —
      # every route the frontend calls answers, with no personal data anywhere in
      # the composition (docs/ENGINEERING_STANDARDS.md §Security). To work against
      # real data instead, replace this line with `- ./data:/app/data`, knowingly.
      - api_data:/app/data
    ports:
      # Loopback only, on the port start.sh already uses, so the browser cannot
      # tell a containerized API from a host one.
      - "127.0.0.1:${API_PORT:-8765}:8765"
    # `--lifespan off` is load-bearing rather than tuning. create_app's lifespan
    # starts server/scheduler.py, whose is_due() defaults `schedule_enabled` to
    # True: a container left up past 08:00 local time would launch the agentic full
    # run by itself — live job boards, live LLM calls — out of a development
    # composition nobody was watching. Turning the lifespan off removes that
    # entirely; run_manager and apply_dispatcher are built in the factory body, so
    # an explicit POST /api/runs/... still works exactly as on the host.
    command:
      - uvicorn
      - --factory
      - server.app:create_app
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --lifespan
      - "off"
    healthcheck:
      # FastAPI's own schema document: it proves the app booted and its routers
      # imported, and it touches neither the database nor any operator file. The
      # image has no curl, so this is Python's stdlib.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/openapi.json').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    # No `depends_on: postgres`. V1's API is SQLite-only and nothing in it reads
    # PostgreSQL yet — Phase 2 imports *into* the database through its CLI. A
    # declared dependency here would be decoration, and would make `up api` wait on
    # a service it never queries.

  # The Nuxt dev server (docker/frontend.Dockerfile). Development convenience, not
  # a production artifact: with `ssr: false` production is a static bundle served
  # by the FastAPI process, so there is nothing else for a Node container to do.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # Read by nuxt.config.ts for the Nitro dev proxy. On a developer's machine
      # the default target is 127.0.0.1:8765; here the API is a service name.
      NUXT_API_PROXY_TARGET: http://api:8765/api
      # Vite's watcher never receives inotify events through a bind mount on macOS
      # or Windows, so without polling an edit on the host never reaches HMR.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Sources bind-mounted so an edit on the host reloads in the container.
      # node_modules and .nuxt stay container-side and must not be shadowed by the
      # host tree, which holds macOS binaries. The trade-off of the named volumes
      # is that they are seeded once from the image: after a dependency change,
      # rebuild and `docker compose down -v` (or `docker volume rm
      # jobsearch_frontend_node_modules`) or the container keeps the old install.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    ports:
      # 3000 is the app's own default and everybody else's; ${FRONTEND_PORT} is
      # there because an unrelated dev server on 3000 is a real and frequent event.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      # `service_started`, not `service_healthy`: the proxy resolves per request,
      # so the frontend is useful before the API answers and must not be held back
      # by it. Wanting the whole stack ready is what `up --wait` is for.
      api:
        condition: service_started
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    command: ["alembic", "upgrade", "head"]

  import-v1:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch_dev_only}@postgres:5432/${POSTGRES_DB:-jobsearch_dev}
    volumes:
      # Read-only, and the importer opens the file read-only as well. The V1
      # tracker is the source of truth until V2 replaces it, and a migration tool
      # that can write to its own input is one bug away from destroying it.
      - ./data:/data:ro
    entrypoint: ["python", "-m", "backend.app.cli.import_v1"]
    command: ["--sqlite", "/data/tracker.db", "--on-error", "skip"]

volumes:
  postgres_data:
    # Named, so `docker compose down` keeps the data and only
    # `docker compose down -v` throws it away.
    name: jobsearch_postgres_data

  api_data:
    # V1's SQLite tracker and settings.json for the containerized API, kept apart
    # from the host `data/` on purpose (see the `api` service). Nothing in it is
    # precious — `down -v` and it is bootstrapped empty again on the next start.
    name: jobsearch_api_data

  # Container-side node_modules and .nuxt, so the bind-mounted sources do not
  # shadow the Linux install with the host's macOS one.
  frontend_node_modules:
    name: jobsearch_frontend_node_modules
  frontend_nuxt:
    name: jobsearch_frontend_nuxt
